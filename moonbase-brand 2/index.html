body{margin:0;background:#FCFCFC;overflow:hidden}

.mb-scroller{height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:#FCFCFC}

.mb-bar{position:fixed;top:0;left:0;right:0;height:56px;z-index:10;background:#FCFCFC;border-bottom:1px solid rgba(31,49,65,.14);font-family:'Aeonik',system-ui,sans-serif;color:#1F3141;-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);transition:background .4s ease,border-color .4s ease,color .4s ease,backdrop-filter .4s ease,-webkit-backdrop-filter .4s ease}
.mb-bar.plain{border-bottom-color:rgba(31,49,65,.14)}
.mb-bar.dark{background:rgba(0,3,31,.32);border-bottom-color:rgba(255,255,255,.16);color:#FFFFFF;-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}
.mb-app{--W:min(100vw, calc((100vh - 56px) * 16 / 9));--L:calc((100vw - var(--W)) / 2 + var(--W) * 50 / 1920);--R:calc((100vw - var(--W)) / 2 + var(--W) * 48 / 1920)}

.mb-bar-in{height:100%;width:100%;box-sizing:border-box;padding:0 var(--R) 0 var(--L);display:flex;align-items:center;justify-content:space-between;gap:16px}

.mb-logo img{height:28px;width:auto;display:block;transition:opacity .4s ease}
.mb-logo img.w{position:absolute;left:0;top:50%;transform:translateY(-50%);opacity:0}
.mb-bar.dark .mb-logo img.b{opacity:0}
.mb-bar.dark .mb-logo img.w{opacity:1}
.mb-logo:focus-visible,.mb-dl:focus-visible{outline:2px solid currentColor;outline-offset:2px}
.mb-dl{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;font-size:12px;font-weight:400;letter-spacing:-0.03em;text-transform:uppercase;color:inherit;white-space:nowrap;border-radius:6px}
.mb-dl svg{width:15px;height:15px;flex:none;transition:transform .25s ease}
.mb-dl:hover svg{transform:translateY(2px)}
.mb-dl:hover{opacity:.75}
.mb-sec.pad{padding-top:56px;box-sizing:border-box}
.mb-scroller{scrollbar-width:none}.mb-scroller::-webkit-scrollbar{display:none}
/* pinned sidebar: one fixed copy over the slides, only the right side moves */
.mb-fix{position:fixed;inset:56px 0 0 0;z-index:5;container-type:size;display:flex;align-items:center;justify-content:center;pointer-events:none;visibility:hidden}
.mb-fix.on{visibility:visible}
.mb-frame{--u:calc(min(100cqw, 177.78cqh) / 1920);display:flex;width:min(100cqw, 177.78cqh);aspect-ratio:16 / 9;box-sizing:border-box;padding:calc(50*var(--u)) calc(48*var(--u)) calc(50*var(--u)) calc(50*var(--u));font-family:'Aeonik',system-ui,sans-serif;color:#1F3141}
.mb-frame .mb-left,.mb-frame .mb-vline{pointer-events:auto}
.mb-slide .mb-left,.mb-slide .mb-vline,.mb-slide .mb-hw.pin{visibility:hidden}
/* while scrolling toward/away from a cover (or a different title), the in-slide copies take over and move with their page */
.free-side .mb-slide .mb-left,.free-side .mb-slide .mb-vline{visibility:visible}
.free-head .mb-slide .mb-hw.pin{visibility:visible}
.mb-fh{position:relative;z-index:0;visibility:hidden}
.mb-fh::before{content:'';position:absolute;z-index:-1;left:calc(-40*var(--u));right:calc(-48*var(--u));top:calc(-50*var(--u));bottom:calc(-24*var(--u));background:#FCFCFC;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 24*var(--u)),transparent calc(100% - 8*var(--u)));mask-image:linear-gradient(to bottom,#000 calc(100% - 24*var(--u)),transparent calc(100% - 8*var(--u)))}
.mb-fh.on{visibility:visible}
.mb-sec{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;container-type:size;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#FCFCFC}
.mb-slide{--u:calc(min(100cqw, 177.78cqh) / 1920);position:relative;display:flex;width:min(100cqw, 177.78cqh);aspect-ratio:16 / 9;box-sizing:border-box;padding:calc(50*var(--u)) calc(48*var(--u)) calc(50*var(--u)) calc(50*var(--u));font-family:'Aeonik',system-ui,sans-serif;color:#1F3141;background:#FCFCFC;overflow:hidden}
.mb-slide.full{width:100cqw;height:100cqh;aspect-ratio:auto;padding:0}
@supports (animation-timeline: view()){
.mb-slide{animation:mbIn linear both;animation-timeline:view();animation-range:entry 0% entry 100%}
@keyframes mbIn{from{opacity:.35;transform:translateY(calc(40*var(--u)))}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion: reduce){.mb-scroller{scroll-behavior:auto}.mb-slide{animation:none}}
.mb-left{width:max(190px,calc(252*var(--u)));flex:none;display:flex;flex-direction:column}
.mb-snum{margin:0;height:calc(161*var(--u));display:flex;align-items:flex-start}
.mb-snum span{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;height:max(22px,calc(29*var(--u)));padding:0 max(9px,calc(12*var(--u)));border-radius:999px;background:#002FFF;color:#FFFFFF;font-size:max(11px,calc(15*var(--u)));font-weight:500;line-height:1;letter-spacing:-0.01em}
.mb-rule{height:max(1px,calc(1*var(--u)));background:#1F3141;flex:none}
.mb-navlist{display:flex;flex-direction:column;margin-top:calc(30*var(--u))}
.mb-nav{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;height:max(24px,calc(32*var(--u)));font-size:max(11px,calc(14.5*var(--u)));line-height:1.15;color:#1F3141;font-weight:400;white-space:nowrap}
.mb-nav .n{width:max(18px,calc(24*var(--u)));flex:none}
.mb-nav.on{font-weight:600}
.mb-nav:hover{color:#002FFF}
.mb-sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;height:max(20px,calc(26*var(--u)));padding-left:max(18px,calc(24*var(--u)));font-size:max(10.5px,calc(12.5*var(--u)));color:#6C7782;white-space:nowrap}
.mb-sub:hover{color:#002FFF}

.mb-nav:focus-visible,.mb-sub:focus-visible,.mb-arrow:focus-visible{outline:2px solid #002FFF;outline-offset:2px}
.mb-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:calc(12*var(--u))}
.mb-pg{margin:0;box-sizing:border-box;height:max(22px,calc(29*var(--u)));min-width:max(60px,calc(80*var(--u)));padding:0 max(9px,calc(13*var(--u)));border:max(1px,calc(1*var(--u))) solid #1F3141;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:max(10.5px,calc(13*var(--u)));font-weight:400;line-height:1;white-space:nowrap}

.mb-arrow svg{width:46%;height:46%;display:block}
.mb-arrow{all:unset;box-sizing:border-box;cursor:pointer;width:max(22px,calc(29*var(--u)));height:max(22px,calc(29*var(--u)));border-radius:50%;border:max(1px,calc(1*var(--u))) solid #1F3141;display:flex;align-items:center;justify-content:center;font-size:calc(18*var(--u));color:#1F3141;transition:background .2s,color .2s,border-color .2s}
.mb-arrow:hover{background:#002FFF;border-color:#002FFF;color:#FFFFFF}
.mb-arrow.off{opacity:.25;cursor:default;pointer-events:none}
.mb-vline{width:max(1px,calc(1*var(--u)));background:#1F3141;margin:0 calc(40*var(--u));flex:none}
.mb-right{flex:1;min-width:0;display:flex;flex-direction:column}
.mb-head{height:calc(161*var(--u));box-sizing:border-box}
.mb-title{margin:0;font-size:max(14px,calc(22*var(--u)));font-weight:500;line-height:1.5;color:#002FFF;text-transform:uppercase}
.mb-body{display:flex;gap:calc(60*var(--u));margin-top:calc(30*var(--u))}
.mb-body p{margin:0;width:calc(520*var(--u));font-size:max(12px,calc(17*var(--u)));line-height:1.35}
.mb-content{position:relative;margin-top:calc(24*var(--u))}
/* geometry guide lines draw in when the page arrives */
.mb-vids{margin-top:calc(40*var(--u));height:calc(778*var(--u));display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:calc(40*var(--u))}
.mb-vfig{margin:0;display:flex;flex-direction:column;min-height:0}

.mb-vcard video{display:block;width:100%;height:100%;object-fit:cover}
@media (max-width:900px), (orientation: portrait) and (max-width:1100px){.mb-vids{grid-template-columns:minmax(0, 1fr);gap:24px;height:auto;margin-top:24px}.mb-vcard{flex:none;aspect-ratio:1 / 1}.mb-vfig figcaption{font-size:14px;line-height:18px}}
/* ảnh nền trôi nhẹ phía sau lớp mask biểu tượng */
.mb-sym{position:absolute;inset:0;overflow:hidden;-webkit-mask-image:url('assets/img/6-3-mask.png');mask-image:url('assets/img/6-3-mask.png');-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;opacity:0;transform:scale(.97);transition:none}
.mb-sec.on .mb-sym{opacity:1;transform:none;transition:opacity .9s ease .15s,transform 1.2s cubic-bezier(.22,.61,.36,1) .15s}
.mb-content img.mb-sym-photo{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 50.7%;animation:mbDrift 14s ease-in-out infinite alternate;animation-play-state:paused;will-change:transform}
.mb-sec.on img.mb-sym-photo{animation-play-state:running}
@keyframes mbDrift{0%{transform:scale(1.06) translate(1.2%,-0.8%)}50%{transform:scale(1.13) translate(-0.6%,0.9%)}100%{transform:scale(1.09) translate(-1.4%,-0.4%)}}
@media (prefers-reduced-motion: reduce){.mb-content img.mb-sym-photo{animation:none;transform:none}.mb-sym{opacity:1;transform:none}}
.mb-gsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mb-gsvg text{font-family:'Aeonik',system-ui,sans-serif;font-weight:400}
/* dashed guides are drawn stroke by stroke: a solid mask path sweeps along each one */
.mb-gsvg .gd{stroke-dasharray:1 1;stroke-dashoffset:1;transition-property:none}
.mb-sec.on .mb-gsvg .gd{stroke-dashoffset:0;transition-property:stroke-dashoffset;transition-timing-function:cubic-bezier(.65,0,.35,1)}
.mb-gsvg .gt{opacity:0;transition-property:none}
.mb-sec.on .mb-gsvg .gt{opacity:1;transition-property:opacity;transition-duration:.6s;transition-timing-function:ease}
/* khuôn tạo hình: các nhánh bung ra từ tâm biểu tượng, rồi “tấm kính” tròn mở rộng để làm rõ phần biểu tượng bên trong */
.mb-gsvg .ry{opacity:0;transform:scale(.8);transform-box:view-box;transform-origin:1136px 416px;transition-property:none}
.mb-sec.on .mb-gsvg .ry{opacity:1;transform:none;transition-property:opacity,transform;transition-duration:1.1s;transition-timing-function:cubic-bezier(.22,.61,.36,1)}
.mb-gsvg .lens{transform:scale(0);transform-box:view-box;transform-origin:1101.3px 450.7px;transition-property:none}
.mb-sec.on .mb-gsvg .lens{transform:none;transition-property:transform;transition-duration:1.3s;transition-delay:.9s;transition-timing-function:cubic-bezier(.65,0,.35,1)}
/* kết hợp: từng chữ V chụm vào tâm, xong hết mới kẻ các vòng nét đứt */
.mb-gsvg .kv{opacity:0;transition-property:none}
.mb-gsvg .kv.vt{transform:translate(0,-150px)}
.mb-gsvg .kv.vb{transform:translate(0,150px)}
.mb-gsvg .kv.vl{transform:translate(-150px,0)}
.mb-gsvg .kv.vr{transform:translate(150px,0)}
.mb-sec.on .mb-gsvg .kv{opacity:1;transform:translate(0,0);transition-property:transform,opacity;transition-duration:.75s,.35s;transition-timing-function:cubic-bezier(.16,1,.3,1),ease}
@media (prefers-reduced-motion: reduce){.mb-gsvg .gd{stroke-dashoffset:0}.mb-gsvg .gt,.mb-gsvg .ry,.mb-gsvg .kv{opacity:1;transform:none}.mb-gsvg .lens{transform:none}}
.mb-content img{display:block;width:100%;height:auto}
.mb-empty{margin-top:calc(38*var(--u));height:calc(780*var(--u));box-sizing:border-box;border:max(1px,calc(1*var(--u))) dashed #AEB4BA;display:flex;align-items:center;justify-content:center;font-size:calc(15.5*var(--u));color:#6C7782}
.mb-panel{position:absolute;inset:0;overflow:hidden}

.mb-arrow.light{border-color:rgba(255,255,255,.85);color:#FFFFFF;background:rgba(0,3,31,.25)}
.mb-arrow.light:hover{background:#FFFFFF;color:#002FFF;border-color:#FFFFFF}
.mb-home{all:unset;box-sizing:border-box;cursor:pointer;height:calc(40*var(--u));padding:0 calc(18*var(--u));border-radius:calc(20*var(--u));border:max(1px,calc(1*var(--u))) solid rgba(255,255,255,.85);color:#FFFFFF;background:rgba(0,3,31,.25);display:flex;align-items:center;font-size:calc(15*var(--u));transition:background .2s,color .2s}
.mb-home:hover{background:#FFFFFF;color:#002FFF}
.mb-home:focus-visible,.mb-arrow.light:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
.mb-hint{position:absolute;left:50%;bottom:calc(40*var(--u));transform:translateX(-50%);z-index:2;color:#FFFFFF;font-size:calc(14*var(--u));letter-spacing:.08em;text-transform:uppercase;opacity:.75;display:flex;flex-direction:column;align-items:center;gap:calc(8*var(--u))}
.mb-hint i{display:block;width:max(1px,calc(1*var(--u)));height:calc(36*var(--u));background:#FFFFFF;animation:mbHint 1.6s ease-in-out infinite;transform-origin:top}
@keyframes mbHint{0%{transform:scaleY(0)}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.mb-cover-top{position:absolute;left:0;right:0;top:0;height:50%;background:#FCFCFC}

.mb-ov{position:absolute;inset:0;display:flex}

<body>
<div id="app"></div>
<template id="tpl">
<div class="{{appCls}}">
<header class="{{barCls}}">
  <div class="mb-bar-in">
    <a class="mb-logo" href="#p-0" aria-label="Moonbase – về trang bìa"><img class="b" src="assets/img/logo-stacked-blue.svg" alt="moonbase"><img class="w" src="assets/img/logo-stacked-white.svg" alt=""></a>
    <a class="mb-dl" href="{{dl.href}}" target="{{dl.target}}" rel="noopener" download="Moonbase-Bo-nhan-dien-thuong-hieu.pdf"><span>Bộ nhận diện thương hiệu mới</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"></path></svg></a>
    <button class="mb-menu-btn" onClick="{{toggleMenu}}" aria-label="Mục lục" aria-expanded="{{menuExp}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="{{menuIcon}}"></path></svg></button>
  </div>
</header>
<div class="{{menuCls}}">
