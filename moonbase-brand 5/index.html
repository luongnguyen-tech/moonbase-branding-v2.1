.mb-sec.on .mb-gsvg .sq{opacity:1;transform:none;transition-property:opacity,transform;transition-duration:.5s;transition-timing-function:cubic-bezier(.16,1,.3,1)}

.mb-sec.on .mb-gsvg .szband{animation:mbBand 2.4s ease 1.9s both}
@keyframes mbBand{0%{opacity:0}20%{opacity:.22}40%{opacity:.06}60%{opacity:.22}100%{opacity:.08}}
.mb-gsvg .sztext{font-family:'Aeonik',system-ui,sans-serif;font-weight:500}
/* monogram: a diagonal wave flips each V (buy/sell) and lights it brand blue */
.mb-gsvg .mv{fill:#78797D;transform-box:fill-box;transform-origin:center;animation:mbFlip 5.2s cubic-bezier(.65,0,.35,1) infinite;animation-play-state:paused}
.mb-sec.on .mb-gsvg .mv{animation-play-state:running}
@keyframes mbFlip{0%,52%{transform:none;fill:#78797D}62%,78%{transform:scaleY(-1);fill:#002FFF}88%,100%{transform:none;fill:#78797D}}
@media (prefers-reduced-motion: reduce){.mb-sec .mb-ov-blue{width:64.4%}.mb-ov-gray .ovsvg{opacity:1}.mb-gsvg .sq{opacity:1;transform:none}.mb-gsvg .mv{animation:none}.mb-gsvg .szband{opacity:.08}}
@media (max-width:900px), (orientation: portrait) and (max-width:1100px){.mb-sec .mb-ov-blue,.mb-sec.on .mb-ov-blue{width:auto;flex:1.4;transition:none}.mb-ov-gray .ovsvg{opacity:1}}

/* halftone: V-glyph portrait rebuilt live; the pointer (or a slow auto light) lights and flips the V's */
.mb-content canvas.mb-ht{position:absolute;left:calc(7 / 1489 * 100%);top:calc(11 / 794 * 100%);width:calc(724 / 1489 * 100%);height:calc(783 / 794 * 100%);border-radius:1.66% / 1.53%;cursor:crosshair;touch-action:pan-y;background:#111111}

/* phones: let detailed diagrams pan sideways at 2x instead of shrinking to unreadable size */
@media (max-width:600px){
.mb-cwrap{overflow-x:auto;overflow-y:hidden;margin:20px -16px 0;padding:0 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.mb-cwrap::-webkit-scrollbar{display:none}
.mb-cwrap .mb-content{width:200%}
.mb-right:has(.mb-cwrap)::after{content:"\2190  Vuốt ngang để xem chi tiết  \2192";display:block;margin-top:10px;font-size:12px;letter-spacing:.02em;color:#6C7782;text-align:center}
#p-0 .mb-slide.full{aspect-ratio:auto;height:100svh}
.mb-slide.full{aspect-ratio:4 / 5}
.mb-cover-num{font-size:84px}
.mb-cover-title{font-size:32px;line-height:38px}
.mb-main-title{font-size:34px;line-height:40px;bottom:40px}
.mb-title{font-size:15px}
.mb-body p{font-size:14.5px;line-height:21px}
.mb-sec.pad{padding-top:56px}
.mb-slide{padding:24px 16px 40px}
}
/* tablets in portrait: a bit more air and larger type */
@media (min-width:601px) and (max-width:1100px) and (orientation: portrait){
.mb-slide{padding:32px 32px 48px}
.mb-bar-in{padding:0 32px}
.mb-app{--L:32px;--R:32px}
.mb-title{font-size:18px}
.mb-body{flex-direction:row;gap:28px}
.mb-body p{font-size:16px;line-height:24px;flex:1}
.mb-slide.full{aspect-ratio:4 / 3}
#p-0 .mb-slide.full{aspect-ratio:auto;height:70svh}
.mb-cover-num{font-size:140px}
.mb-cover-title{font-size:52px;line-height:60px}
.mb-main-title{font-size:56px;line-height:62px;bottom:48px}
.mb-vids{grid-template-columns:repeat(2, minmax(0, 1fr))}
}
</style>

    <button class="mb-menu-btn" onClick="{{toggleMenu}}" aria-label="Mục lục" aria-expanded="{{menuExp}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="{{menuIcon}}"></path></svg></button>

</div>
<div class="mb-scroller" onScroll="{{onScroll}}">

            <div class="mb-rule"></div>
            <div class="mb-navlist">

                  <sc-if value="{{item.showSubs}}" hint-placeholder-val="{{false}}">
                    <div style="display: flex; flex-direction: column">
                      <sc-for list="{{p.subs}}" as="s" hint-placeholder-count="4">
                        <a class="{{s.cls}}" href="{{s.href}}">{{s.label}}</a>
                      </sc-for>
                    </div>
                  </sc-if>
                </div>
              </sc-for>
            </div>
            <div class="mb-foot">

              </div>
            </div>
          </nav>
          <div class="mb-vline" aria-hidden="true"></div>
          <main class="mb-right">
            <div class="{{p.hwCls}}">
            <div class="mb-head">
              <h1 class="mb-title">{{p.title}}</h1>
              <sc-if value="{{p.hasBody}}" hint-placeholder-val="{{false}}">
                <div class="mb-body">
                  <p>{{p.body1}}</p>
                  <sc-if value="{{p.hasBody2}}" hint-placeholder-val="{{false}}">
                    <p>{{p.body2}}</p>
                  </sc-if>
                </div>
              </sc-if>
            </div>
            <div class="mb-rule"></div>
            </div>
            <sc-if value="{{p.hasImg}}" hint-placeholder-val="{{true}}">

<sc-if value="{{p.hasSym}}" hint-placeholder-val="{{false}}"><div class="mb-sym" aria-hidden="true"><img class="mb-sym-photo" src="assets/img/6-3-photo.webp" alt=""></div></sc-if>
